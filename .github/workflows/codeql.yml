---
name: codeql

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze python
    runs-on: ubuntu-latest
    # Code scanning on a private repository needs GitHub Advanced Security, so
    # this would fail with a 403 until the repository is public. Skipping while
    # private is honest; pretending to scan would not be.
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Initialise
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          languages: python

      - name: Analyse
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
