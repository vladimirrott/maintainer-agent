---
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only. One job uses `github.token`, which is the same credential as
# `secrets.GITHUB_TOKEN` under another name, and it is scoped by the
# `permissions: contents: read` above. No other secret is used, and none is
# needed: a fork's pull request runs the same gates as a branch, which is the
# point. The gates used to live only in a pre-commit hook on one laptop, so a
# contributor had no way to know whether their change passed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: the four gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Syntax, every script, dispatched by shebang
        run: |
          rc=0
          for f in $(git ls-files); do
            [ -f "$f" ] || continue
            case "$(head -c 80 "$f" 2>/dev/null)" in
              *"#!/usr/bin/env bash"*|*"#!/bin/bash"*|*"#!/bin/sh"*) bash -n "$f" || rc=1 ;;
              *"#!/usr/bin/env python3"*) python3 -c "import ast,sys;ast.parse(open(sys.argv[1]).read())" "$f" || rc=1 ;;
            esac
          done
          exit $rc

      # The same suite with no deployed tree, which is what a fresh machine and
      # every CI runner look like. A cursor-wall test read
      # $HOME/.local/share/maintainer/... and so measured the laptop that wrote
      # it: green locally, four failures on the release workflow, after the tag
      # was already pushed. Running it twice costs seconds and catches the whole
      # class, which is a test that passes because of something it did not build.
      - name: Offline test suite, with no deployed tree
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          HOME="$scratch" ./tests/run-tests.sh | tail -3
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error::the suite depends on a deployed tree" >&2; exit "$rc"; }

      - name: Offline test suite
        # Zero skips required. A skip means this machine could not run a case,
        # and the runner has docker, so every case that needs a container
        # runtime must actually run here even though a contributor's laptop may
        # not have one. Without this a missing tool would read as a green board.
        run: |
          ./tests/run-tests.sh | tee /tmp/suite.log
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || exit "$rc"
          # Anchored on the summary line. `grep -q skipped` over the whole log
          # matched the NAME of the test that proves skips are counted, so a run
          # with zero skips failed for containing the word. Third time today a
          # check has matched its own documentation.
          if grep -qE '^ +[0-9]+ passed, [0-9]+ failed, [0-9]+ skipped' /tmp/suite.log; then
            echo "::error::the suite skipped a case; CI must run all of them" >&2
            grep '  SKIP' /tmp/suite.log >&2
            exit 1
          fi

      - name: Eval rules, for every profile
        run: |
          rc=0
          for pe in profiles/*/profile.env; do
            pn="$(basename "$(dirname "$pe")")"
            [ "$pn" = "_template" ] && continue
            echo "--- $pn ---"
            MAINTAINER_PROFILE="$pn" ./evals/run-evals.sh || rc=1
          done
          exit $rc

      - name: README numbers are derived from the tree
        run: ./scripts/check_claims.sh

      - name: Every action pin is the tag it claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-action-pins.sh

      - name: Every relative link in every document resolves
        run: |
          python3 - <<'PY'
          import re, os, glob, sys
          bad = []
          for f in glob.glob("**/*.md", recursive=True):
              base = os.path.dirname(f)
              for m in re.finditer(r'\]\((?!https?:|mailto:|#)([^)#]+)', open(f).read()):
                  t = m.group(1).strip()
                  if not (os.path.exists(os.path.normpath(os.path.join(base, t)))
                          or os.path.exists(os.path.normpath(t.lstrip("/")))):
                      bad.append(f"{f}: {t}")
          for b in bad:
              print("broken link:", b)
          sys.exit(1 if bad else 0)
          PY

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # The sweep lives in scripts/ so the pre-commit hook runs the same one.
      # It was inline here, which meant a contributor could pass every local
      # gate and still be told about SC1090 by a push.
      - name: Run it over every shell script
        run: scripts/shellcheck-sweep.sh

  powershell:
    name: the Windows installer parses
    runs-on: ubuntu-latest
    # A real PowerShell, not a brace count. The local suite skips this when the
    # image is absent, and an absent dependency that turns a gate green is a
    # trap this project has already paid for. Here it cannot be skipped.
    container: mcr.microsoft.com/powershell:latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Parse Install-Maintainer.ps1
        shell: pwsh {0}
        run: |
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "platform/windows/Install-Maintainer.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "parsed, $($tokens.Count) tokens"
