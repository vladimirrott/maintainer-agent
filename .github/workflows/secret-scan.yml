---
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A key committed on a Tuesday is not found by a gate that only runs on push.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Scan the whole history
        # Pinned to a branch on purpose: this action ships from main and has no
        # release tags to pin to, which is stated here so the absent version
        # comment is visible rather than looking like an oversight.
        uses: trufflesecurity/trufflehog@05a583290be8c8f79852eb8741f5042920b47d00  # main
        with:
          extra_args: --only-verified
