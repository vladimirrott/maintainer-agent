<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- 1280x640 is GitHub's recommended social preview size, cropped 2:1, and the
       docs warn to keep anything that matters 50px clear of every edge. -->
  <rect width="1280" height="640" fill="#14171c"/>
  <g transform="translate(132,196) scale(0.484)">
    <rect width="512" height="512" rx="112" fill="#20252d"/>
    <g fill="#e8e6e1">
      <rect x="120" y="150" width="46" height="212" rx="23"/>
      <rect x="192" y="150" width="46" height="212" rx="23"/>
    </g>
    <path d="M 282 270 L 322 344 L 396 168" fill="none" stroke="#e0a44c" stroke-width="50"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="DejaVu Sans Mono, monospace">
    <text x="424" y="296" font-size="66" font-weight="bold" fill="#e8e6e1">maintainer-agent</text>
    <text x="428" y="356" font-size="27" fill="#98a0ab">an unattended maintainer for one repository</text>
    <text x="428" y="400" font-size="27" fill="#e0a44c">merges only against proof that a guard bites</text>
  </g>
</svg>
